
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
</head>
<body>

    <h1>Weather Forecast Application</h1>

    <h2>Select Location</h2>

    <button onclick="getGPSLocation()">Use My GPS</button>
    <button onclick="getWeather()">Manual Location</button>

    <p id="locationResult"></p>

    <hr>

    <div id="weatherResult"></div>

    <div id="forecastResult"></div>

    <script>

        const apiKey = "b32786b808e33a9e3d7051cd1a10ad6f";

        // Manual City Search
        async function getWeather() {

            const city = prompt("Enter a city name");

            if (!city) {
                alert("No city entered");
                return;
            }

            const url =
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();

                // Get weather using coordinates
                getWeatherByCoordinates(
                    data.coord.lat,
                    data.coord.lon
                );

            } catch (error) {

                alert("Error: " + error.message);

            }
        }


        // Get Device GPS Location
        function getGPSLocation() {

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            document.getElementById("locationResult").innerHTML =
                "Getting your location...";

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    getWeatherByCoordinates(latitude, longitude);

                },

                function(error) {

                    document.getElementById("locationResult").innerHTML = "";

                    alert("GPS Error: " + error.message);

                }

            );
        }


        // Get Current Weather and Forecast Using Coordinates
        async function getWeatherByCoordinates(latitude, longitude) {

            const weatherUrl =
                `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;

            const forecastUrl =
                `https://api.openweathermap.org/data/2.5/forecast?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;

            try {

                // Current Weather
                const weatherResponse = await fetch(weatherUrl);

                if (!weatherResponse.ok) {
                    throw new Error("Unable to retrieve weather");
                }

                const data = await weatherResponse.json();

                document.getElementById("locationResult").innerHTML =
                    `Location: ${data.name}, ${data.sys.country}`;

                document.getElementById("weatherResult").innerHTML = `

                    <h2>Current Weather</h2>

                    <h3>${data.name}, ${data.sys.country}</h3>

                    <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png">

                    <p>Temperature: ${data.main.temp} °C</p>

                    <p>Weather: ${data.weather[0].description}</p>

                    <p>Humidity: ${data.main.humidity}%</p>

                    <p>Wind Speed: ${data.wind.speed} m/s</p>

                `;


                // 5-Day Forecast
                const forecastResponse = await fetch(forecastUrl);

                if (!forecastResponse.ok) {
                    throw new Error("Unable to retrieve forecast");
                }

                const forecastData = await forecastResponse.json();

                const forecastResult =
                    document.getElementById("forecastResult");

                forecastResult.innerHTML = `
                    <h2>5-Day Weather Forecast</h2>
                `;

                // Display forecast every 24 hours
                forecastData.list
                    .filter(item => item.dt_txt.includes("12:00:00"))
                    .forEach(item => {

                        forecastResult.innerHTML += `

                            <hr>

                            <h3>${item.dt_txt}</h3>

                            <img src="https://openweathermap.org/img/wn/${item.weather[0].icon}@2x.png">

                            <p>Temperature: ${item.main.temp} °C</p>

                            <p>Weather: ${item.weather[0].description}</p>

                            <p>Humidity: ${item.main.humidity}%</p>

                            <p>Wind Speed: ${item.wind.speed} m/s</p>

                        `;

                    });

            } catch (error) {

                alert("Error: " + error.message);

            }

        }

    </script>

</body>
</html>
