
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .container {
            display: flex;
            gap: 15px;
        }

        #locations {
            width: 250px;
        }

        #map {
            flex: 1;
            height: 500px;
        }

        .location {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .location:hover {
            background: #eee;
        }

        .popup-image {
            max-width: 200px;
        }
    </style>
</head>
<body>

    <h1>Campus Map</h1>

    <div class="container">
        <div id="locations">
            <h3>Locations</h3>
            <div id="location-list"></div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        const map = L.map('map').setView([8.360, 124.868], 17);

        const osm = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            { maxZoom: 19 }
        );

        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        );

        satellite.addTo(map);

        L.control.layers({
            "OpenStreetMap": osm,
            "Satellite": satellite
        }).addTo(map);

        fetch('campus-map.json')
            .then(response => response.json())
            .then(data => {
                data.forEach((pin, index) => {
                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);

                    marker.bindPopup(`
                        <strong>${pin.title}</strong><br>
                        <img src="${pin.img}" class="popup-image">
                    `);

                    const item = document.createElement('div');
                    item.className = 'location';
                    item.textContent = pin.title;

                    item.onclick = () => {
                        map.flyTo([pin.lat, pin.lng], 18);
                        marker.openPopup();
                    };

                    document.getElementById('location-list')
                        .appendChild(item);
                });
            })
            .catch(error => console.error('Error loading map:', error));
    </script>

</body>
</html>
