<body>

    <h1>Todo List</h1>
    <input type="text"
            id="taskInput"
            placeholder="Add a task"
    />

    <ul id="taskList">Your tasks go here ...</ul>

<script>
function getTaskText(){
    const input = document.getElementById('taskInput');
    const text = input.value.trim();

    console.log("The input value is: " + input.value);
    return text;
}
function addTask(){
    getTaskText();
}
</script>
