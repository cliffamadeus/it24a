<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maps</title>


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3D/miZyoHS5obTRR9BMY="
        crossorigin=""
    >


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }


        h1 {
            padding: 0 20px;
        }


        /* Main two-column layout */
        .map-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 500px;
        }


        /* Pin column */
        #pin-list {
            overflow-y: auto;
            border-right: 1px solid #ddd;
            background: #f8f8f8;
        }


        /* Individual pin */
        .pin-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }


        .pin-item:hover {
            background: #eaeaea;
        }


        .pin-title {
            font-weight: bold;
        }


        .pin-type {
            font-size: 13px;
            color: #666;
        }


        /* Map */
        #map {
            height: 500px;
        }


        /* Popup image */
        .popup-image {
            max-width: 200px;
            height: auto;
            object-fit: fill;
        }

    </style>

</head>


<body>

    <h1>Simple Map</h1>


    <div class="map-container">

        <!-- Pin List -->
        <div id="pin-list"></div>


        <!-- Map -->
        <div id="map"></div>

    </div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>


    <script>

        function initMap(mapDataUrl) {

            // Create map
            const map = L.map('map').setView(
                [8.360, 124.868],
                17
            );


            // OpenStreetMap
            L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    maxZoom: 19,

                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            ).addTo(map);


            // Load map data
            fetch(mapDataUrl)

                .then(response => response.json())

                .then(data => {

                    // Pin list container
                    const pinList =
                        document.getElementById('pin-list');


                    // Process every pin
                    data.forEach(pin => {

                        const type =
                            pin.locationType || "Other";


                        // Create marker
                        const marker = L.marker([
                            pin.lat,
                            pin.lng
                        ]).addTo(map);


                        // Popup image
                        const img = `
                            <img
                                src="${pin.img}"
                                class="popup-image"
                            >
                        `;


                        // Marker popup
                        marker.bindPopup(`
                            ${img}
                            <br>

                            <b>${pin.title}</b>
                            <br>

                            ${pin.description}
                            <br>

                            ${type}
                        `);


                        // Create pin list item
                        const pinItem =
                            document.createElement('div');


                        pinItem.className = 'pin-item';


                        pinItem.innerHTML = `
                            <div class="pin-title">
                                ${pin.title}
                            </div>

                            <div class="pin-type">
                                ${type}
                            </div>
                        `;


                        // Fly to pin
                        pinItem.addEventListener(
                            'click',
                            () => {

                                map.flyTo(
                                    [pin.lat, pin.lng],
                                    19,
                                    {
                                        duration: 1.5
                                    }
                                );


                                // Open popup
                                marker.openPopup();

                            }
                        );


                        // Add item to list
                        pinList.appendChild(pinItem);

                    });

                })

                .catch(error => {

                    console.error(
                        'Error loading map data:',
                        error
                    );

                });

        }


        // Initialize map
        initMap('campus-map.json');

    </script>

</body>

</html>
