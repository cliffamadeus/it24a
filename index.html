<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

</head>
<style>
    #map{
        height: 500px;
    }
    .popup-image{
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }
</style>
<body>
    <h1>Simple Map</h1>
    <div id="map"></div>
</body>
<script>

function initMap(mapDataUrl){

    const map= L.map('map').setView([8.360,124.868],17);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,
        attribution:'&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    fetch(mapDataUrl)
        .then(response => response.json())
        .then(data=>{

            //Markers
            data.forEach(pin => {
                const type = pin.locationType || "Other";

                //Marker and Popup
                const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                const img = `<img src='${pin.img}' class="popup-image">`;
                    marker.bindPopup(`
                        ${img} <br>
                        <b>${pin.title}<br>
                        ${pin.description}<br>
                        ${pin.locationType}
                `);
                console.log(`${pin.name} Loaded ` + Date());

            });
        })

}

document.addEventListener("DOMContentLoaded",()=>{
    initMap('campus-map.json');
})

</script>
</html>
